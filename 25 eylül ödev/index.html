<!doctype html>
<!-- Tarayıcıya bu belgenin modern HTML5 standartlarında yazıldığını bildirir. -->

<html lang="en">
<!-- Tüm HTML elemanlarını saran kök (root) etikettir ve sayfanın dilini belirtir. -->

  <head>
  <!-- Sayfanın kullanıcıya doğrudan görünmeyen; karakter seti, başlık ve CSS gibi yapılandırma bilgilerini barındıran bölümdür. -->

    <meta charset="UTF-8" />
    <!-- Türkçe karakterlerin ve özel sembollerin bozulmadan görünmesini sağlayan evrensel karakter kodlamasıdır. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sayfanın mobil ve tablet ekranlarda cihaz genişliğine uyum sağlamasını ve başlangıç yakınlaştırma oranının 1.0 olmasını sağlar. -->

    <title>Sipariş & Gelir Kokpit Dashboard</title>
    <!-- Tarayıcı sekmesinde görünen sayfa başlığıdır. -->

    <style>
      /* =========================================
         1. CSS DEĞİŞKENLERİ (CUSTOM PROPERTIES)
         ========================================= */
      :root {
        --bg: #f8f7f4;
        --card: #ffffff;
        --border: #e6e5df;
        --text: #181716;
        --muted: #6b6963;
        --clay: #c85a32;
        --clay-hover: #b04e29;
        --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      /* Tüm sayfada geçerli global CSS değişkenlerini tanımlar. Renk ve fontları tek bir merkezden yönetmeyi sağlar. */

      /* =========================================
         2. CSS RESET & TEMEL SAYFA AYARLARI
         ========================================= */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      /* Tüm HTML etiketlerinin varsayılan iç ve dış boşluklarını sıfırlar. box-sizing: border-box ile verilen iç boşluk ve kenarlıkların kutu genişliğini şişirmesini engeller. */

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        padding: 36px 16px;
        line-height: 1.5;
      }
      /* Sayfanın ana gövdesine arka plan rengi, metin rengi, ana yazı tipi, iç boşluk ve satır yüksekliği değerlerini uygular. */

      .kokpit {
        max-width: 960px;
        margin: 0 auto;
      }
      /* Ana taşıyıcı kutunun maksimum genişliğini 960px ile sınırlar ve margin: 0 auto ile kutuyu ekranın tam ortasına hizalar. */

      /* =========================================
         3. ÜST BİLGİ (HEADER) & KPI KARTLARI
         ========================================= */
      .header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      /* Üst başlık alanının altındaki elemanlarla arasına dış boşluk, kendi alt çizgisiyle metin arasına iç boşluk koyar ve altına ince bir ayırıcı çizgi çeker. */

      .header__tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--clay);
        font-weight: 700;
      }
      /* Küçük üst etiketin tüm harflerini büyütür, harfler arası boşluğu açar, yazıyı kalınlaştırır ve kiremit rengine boyar. */

      .header__title {
        font-size: 26px;
        font-weight: 700;
        margin-top: 2px;
      }
      /* Ana başlığın yazı boyutunu 26px, kalınlığını 700 yapar ve üstteki etiketle arasına 2px boşluk bırakır. */

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }
      /* İstatistik (KPI) kartlarını CSS Grid sistemiyle 3 eşit sütuna böler ve aralarına 14px boşluk bırakır. */

      .kpi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 18px;
      }
      /* Her bir istatistik kartına beyaz arka plan, ince çerçeve, köşe yuvarlatma ve iç boşluk verir. */

      .kpi-card span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      /* Kartların içindeki küçük açıklama başlıklarını soluk gri renkte ve 12px boyutunda biçimlendirir. */

      .kpi-card h3 {
        font-size: 22px;
        font-weight: 700;
        font-family: var(--font-mono);
        margin-top: 4px;
      }
      /* Kartların içindeki rakamsal değerleri monospace yazı tipiyle 22px boyutunda ve kalın olarak gösterir. */

      /* =========================================
         4. ANA YERLEŞİM (LAYOUT) & RESPONSIVE
         ========================================= */
      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      /* Sayfanın alt kısmını 2 sütuna böler: Sol sütun sabit 320px genişlik alır, sağ sütun ise kalan tüm alanı kaplar. */

      @media (max-width: 768px) {
        .layout,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }
      /* Ekran genişliği 768 piksel ve altına düştüğünde yan yana duran 3'lü KPI kartlarını ve 2'li ana yerleşimi tek sütuna düşürerek alt alta dizer. */

      /* =========================================
         5. FORM & PANEL TASARIMI
         ========================================= */
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      /* Sol ve sağ bölümdeki ana beyaz kutuların çerçeve, arka plan, köşe yuvarlatma ve iç boşluk özelliklerini belirler. */

      .panel h4 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      /* Panel içindeki alt başlığın altına ince bir çizgi çeker ve form elemanlarıyla arasına mesafe koyar. */

      .field {
        margin-bottom: 12px;
      }
      /* Her bir form satırının altındaki diğer form elemanıyla arasına 12px boşluk bırakır. */

      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      /* Etiketlerin bulunduğu satırı tamamen kaplamasını (block) ve altındaki veri giriş kutusunun bir alt satıra inmesini sağlar. */

      .field input,
      .field select {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      /* Metin kutuları ve açılır menülerin bulundukları alanı %100 kaplamasını, ana yazı tipini miras almasını ve standart iç boşluk/kenarlık kazanmasını sağlar. */

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--clay);
        background: #fff;
      }
      /* Kullanıcı veri girmek için kutuya tıkladığında varsayılan dış çizgiyi kaldırır, kenarlığı kiremit rengi yapar ve arka planı beyazlatır. */

      .btn-submit {
        width: 100%;
        background: var(--clay);
        color: #fff;
        border: none;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 6px;
      }
      /* Kaydet butonunu tam genişlik yapar, kiremit rengine boyar ve üzerine gelindiğinde fare imlecinin el işaretine dönüşmesini sağlar. */

      .btn-submit:hover {
        background: var(--clay-hover);
      }
      /* Fareyle kaydet butonunun üzerine gelindiğinde arka plan rengini bir ton koyulaştırır. */

      /* =========================================
         6. LİSTE, FİLTRE & ETİKET (BADGE) TASARIMI
         ========================================= */
      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      /* Arama kutusu ve kategori filtresini Flexbox kullanarak yan yana hizalar ve aralarına 10px boşluk bırakır. */

      .order-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* Sipariş kartlarının ekleneceği kapsayıcıyı dikey bir Flexbox yapar; kartların alt alta 10px boşlukla dizilmesini sağlar. */

      .order-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      /* Tek bir sipariş satırını temsil eder. Sol taraftaki ürün bilgisi ile sağ taraftaki kategori/sil butonunu iki uca yaslar ve dikeyde ortalar. */

      .order-item h5 {
        font-size: 13px;
        font-weight: 600;
      }
      /* Sipariş kartındaki ürün adını biçimlendirir. */

      .order-item p {
        font-size: 12px;
        color: var(--muted);
      }
      /* Sipariş kartındaki birim fiyat metnini biçimlendirir. */

      .meta-box {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* Sipariş kartının sağ tarafındaki kategori rozeti ile "Sil" butonunu yan yana ve dikeyde ortalı tutar. */

      .badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 600;
        background: #fef3c7;
        color: #92400e;
        font-family: var(--font-mono);
      }
      /* Kategori etiketlerinin ortak temel boyut, dolgu ve yazı tipi özelliklerini tanımlar. */

      .badge--mobilya {
        background: #e0e7ff;
        color: #3730a3;
      }
      /* Mobilya kategorisine özel mavi/mor tonlarında renk teması uygular. */

      .badge--aydinlatma {
        background: #fef3c7;
        color: #b45309;
      }
      /* Aydınlatma kategorisine özel sarı/kehribar tonlarında renk teması uygular. */

      .badge--seramik {
        background: #d1fae5;
        color: #065f46;
      }
      /* Diğer kategoriler için kullanılan yeşil tonlarında renk teması uygular. */

      .btn-del {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      /* "Sil" butonunu şeffaf bir arka plan ve ince çerçeve ile biçimlendirir. */

      .btn-del:hover {
        background: #ef4444;
        color: #fff;
        border-color: #ef4444;
      }
      /* Kullanıcı "Sil" butonunun üzerine geldiğinde arka planı kırmızıya, yazıyı beyaza çevirir. */
    </style>
  </head>

  <body>
    <div class="kokpit">
    <!-- Tüm sayfa içeriğini ortalayan ve maksimum 960px genişlikte tutan ana kapsayıcı. -->

      <header class="header">
        <span class="header__tag"> Sipariş Takip </span>
        <h1 class="header_title">Sipariş Yönetim Kokpiti</h1>
      </header>
      <!-- Sayfanın en üstündeki başlık ve üst etiket bölümü. -->

      <section class="kpi-grid">
      <!-- Üstteki 3'lü özet istatistik kartlarını bir arada tutan bölüm. -->

        <div class="kpi-card">
          <span>Kayıtlı Sipariş</span>
          <h3 id="kpiCount">0</h3>
        </div>
        <!-- Toplam sipariş adedini gösteren kart. JavaScript ile güncellenmesi için id="kpiCount" tanımlanmıştır. -->

        <idv class="kpi-card">
          <span>Toplam Sipariş Tutarı: </span>
          <h3 id="kpiTotal">0 ₺</h3>
        </idv>
        <!-- Siparişlerin toplam parasal tutarını gösteren kart. JavaScript ile güncellenmesi için id="kpiTotal" tanımlanmıştır. -->

        <div class="kpi-card">
          <span>Ortalama Ürün Fiyatı</span>
          <h3 id="kpiAvg">0 ₺</h3>
        </div>
        <!-- Siparişlerin ortalama fiyatını gösteren kart. JavaScript ile güncellenmesi için id="kpiAvg" tanımlanmıştır. -->
      </section>

      <main class="layout">
      <!-- Sayfanın ana içeriğini barındıran bölüm. Sol tarafta form, sağ tarafta liste yer alır. -->

        <section class="panel">
          <h4>Yeni Sipariş Kaydı</h4>
          <form id="orderForm">
          <!-- Kullanıcıdan yeni ürün verisi toplamak için oluşturulan form alanı. -->

            <div class="field">
              <label for="prodName">Ürün Adı: </label>
              <input type="text" id="prodName" placeholder="Sehpa" required />
            </div>
            <!-- Ürün adı giriş alanı. required özelliği kutu boşken formun gönderilmesini engeller. -->

            <div class="field">
              <label for="prodCat">Kategori</label>
              <select name="prodCat" id="prodCat">
                <option value="Mobilya">Mobilya</option>
                <option value="Aydınlatma">Aydınlatma</option>
                <option value="Mutfak">Mutfak</option>
              </select>
            </div>
            <!-- Kullanıcının sabit seçenekler arasından kategori seçmesini sağlayan açılır liste. -->

            <div class="field">
              <label for="prodPrice">Fiyat</label>
              <input
                type="number"
                id="prodPrice"
                value="3250"
                min="100"
                step="50"
                required
              />
            </div>
            <!-- Sadece sayısal değer kabul eden, varsayılan değeri 3250 olan, en az 100 girilebilen ve 50'şer artıp azalan fiyat giriş kutusu. -->

            <button type="submit" class="btn-submit">Siparişi Kaydet</button>
            <!-- Tıklandığında bağlı olduğu formun gönderilme (submit) olayını tetikleyen buton. -->
          </form>
        </section>

        <section class="panel">
        <!-- Sağ sütun: Filtreleme araçları ve dinamik sipariş listesini barındıran panel. -->

          <div class="filter-bar">
            <input
              type="text"
              id="searchInput"
              class="field"
              style="margin-bottom: 0"
              placeholder="Ürün Adına Göre Filtrele"
            />
            <!-- Ürün adına göre anlık metin araması yapmak için kullanılan giriş kutusu. -->

            <select
              id="categoryFilter"
              style="width: 130px; font-size: 12px; padding: 6px"
            >
              <option value="ALL">Tüm Kategoriler</option>
              <option value="Mobilya">Mobilya</option>
              <option value="Aydınlatma">Aydınlatma</option>
              <option value="Mutfak">Mutfak</option>
            </select>
            <!-- Sipariş listesini seçilen kategoriye göre filtreleyen açılır menü. -->
          </div>

          <div id="orderContainer" class="order-list">
            <!--Dinamik olarak elemanlar buraya basılacak/eklenecek-->
          </div>
          <!-- JavaScript tarafından oluşturulan sipariş kartlarının içine ekleneceği liste kapsayıcısı. -->
        </section>
      </main>

      <script> 
        /* =========================================
           1. VERİ MODELİ (BAŞLANGIÇ VERİSİ)
           ========================================= */
        let orders = [
          { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
          { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
          { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
          { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
          { id: 5, name: "Ocak", category: "Mutfak", price: 15000 },
        ];
        // Uygulamanın başlangıç sipariş verilerini tutan nesne dizisi (Array of Objects).

        /* =========================================
           2. DOM ELEMENTLERİNİ YAKALAMA
           ========================================= */
        const orderContainer = document.getElementById("orderContainer");
        // Sipariş kartlarının içine ekleneceği ana kapsayıcı elemanı seçer.

        const orderForm = document.getElementById("orderForm");
        // Yeni sipariş ekleme formunu seçer.

        const searchInput = document.getElementById("searchInput");
        // Ürün adına göre arama yapılan metin kutusunu seçer.

        const categoryFilter = document.getElementById("categoryFilter");
        // Kategoriye göre filtreleme yapılan açılır menüyü seçer.

        const kpiCount = document.getElementById("kpiCount");
        // Toplam sipariş sayısının gösterileceği etiketi seçer.

        const kpiTotal = document.getElementById("kpiTotal");
        // Toplam sipariş tutarının gösterileceği etiketi seçer.

        const kpiAvg = document.getElementById("kpiAvg");
        // Ortalama ürün fiyatının gösterileceği etiketi seçer.

        /* =========================================
           3. KPI (İSTATİSTİK) HESAPLAMA FONKSİYONU
           ========================================= */
        const updateKPIs = (dataList) => {
        // Parametre olarak gelen ürün listesine (dataList) göre üstteki istatistik kartlarını güncelleyen fonksiyon.

          kpiCount.textContent = dataList.length;
          // Listedeki eleman sayısını alıp "Kayıtlı Sipariş" kartına yazar.

          if (dataList.length === 0) {
            kpiTotal.textContent = "0 ₺";
            kpiAvg.textContent = "0 ₺";
            return;
          }
          // Eğer listede hiç ürün yoksa toplam ve ortalama değerlerini "0 ₺" olarak ayarlar ve fonksiyonu sonlandırır.

          const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
          // reduce metodu ile listedeki tüm ürünlerin fiyatlarını (curr.price) başlangıç değeri 0 olan biriktirici (acc) üzerinde toplar.

          kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;
          // Hesaplanan toplam tutarı Türkçe binlik ayraç formatına çevirerek ekrana yazar.

          const avg = total / dataList.length;
          // Toplam tutarı listedeki ürün sayısına bölerek ortalama fiyatı hesaplar.

          kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
          // Ortalama fiyatı en yakın tam sayıya yuvarlar, Türkçe sayı formatına çevirir ve ekrana yazar.
        };

        /* =========================================
           4. FİLTRELEME VE EKRANA ÇİZDİRME (RENDER MOTORU)
           ========================================= */
        const renderOrders = () => {
        // Arama ve kategori kriterlerine göre verileri süzüp ekrandaki listeyi oluşturan fonksiyon.

          const term = searchInput.value.toLowerCase().trim();
          // Arama kutusundaki metni alır, tamamını küçük harfe çevirir ve kenarlarındaki boşlukları temizler.

          const selectedCat = categoryFilter.value;
          // Kategori filtresinde o an seçili olan değeri alır.

          const filtered = orders.filter((order) => {
            const matchesName = order.name.toLowerCase().includes(term);
            const mathesCategory =
              selectedCat === "ALL" || order.category === selectedCat;
            return matchesName && mathesCategory;
          });
          // Ürün adı arama kelimesini içeren VE kategorisi seçilen kategoriye uyan ("ALL" seçiliyse tümü) siparişleri süzerek yeni bir dizi oluşturur.

          orderContainer.innerHTML = "";
          // Yeni listeyi ekrana basmadan önce mevcut liste içeriğini temizler.

          if (filtered.length === 0) {
            orderContainer.innerHTML = `
            <div style="padding:24px; text-align:center; color:var(--muted); font-size:12px">
            Kriterlere Uygun Ürün Bulunamadı
            </div>
            `;
            updateKPIs([]);
            return;
          }
          // Filtreleme sonucunda hiçbir ürün bulunamazsa ekrana uyarı mesajı basar, istatistikleri sıfırlar ve fonksiyonu sonlandırır.

          /* =========================================
             5. DİNAMİK DOM ELEMENTİ ÜRETİMİ
             ========================================= */
          filtered.forEach((order) => {
          // Filtrelenmiş dizideki her bir sipariş nesnesi için sırayla aşağıdaki işlemleri uygular:

            const item = document.createElement("article");
            // Yeni bir <article> HTML elementi oluşturur.

            item.className = "order-item";
            // Oluşturulan elemente CSS tasarımı için "order-item" sınıfını atar.

            item.setAttribute("data-id", order.id);
            // Elemente siparişin kimlik numarasını tutan "data-id" niteliğini ekler.

            const badgeClass =
              order.category === "Mobilya"
                ? "badge--mobilya"
                : order.category === "Aydınlatma"
                  ? "badge--aydinlatma"
                  : "badge--seramik";
            // Siparişin kategorisine göre uygulanacak rozet rengi sınıfını belirler.

            item.innerHTML = `
                <div>
                <h5>${order.name}</h5>
                <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                <span class="badge ${badgeClass}">${order.category}</span>
                <button class="btn-del"
                data-action="delete">Sil</button>
                </div>
                `;
            // Sipariş kartının iç HTML yapısını ürün adı, formatlanmış fiyatı, kategori rozeti ve sil butonu ile doldurur.

            orderContainer.appendChild(item);
            // Hazırlanan sipariş kartını sayfada görünmesi için liste kapsayıcısının içine ekler.

            updateKPIs(filtered);
            // Filtrelenmiş güncel listeyi kullanarak üstteki istatistik kartlarını günceller.
          });
        };

        /* =========================================
           6. OLAY DİNLEYİCİLERİ (EVENT LISTENERS) & BAŞLATMA
           ========================================= */
        searchInput.addEventListener("input", renderOrders);
        // Arama kutusuna her harf yazıldığında veya silindiğinde renderOrders fonksiyonunu çalıştırır.

        categoryFilter.addEventListener("change", renderOrders);
        // Kategori açılır menüsündeki seçim her değiştirildiğinde renderOrders fonksiyonunu çalıştırır.

        renderOrders();
        // Sayfa ilk yüklendiğinde başlangıç verilerinin ekrana çizilmesi için fonksiyonu çalıştırır.
      </script>
    </div>
  </body>
</html>
