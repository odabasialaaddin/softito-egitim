<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keşif Platformu | Dashboard</title>
    
    <style>
        :root {
            --bg-color: #0f172a;        
            --text-color: #f8fafc;      
            --card-bg: #1e293b;         
            --glass-bg: rgba(15, 23, 42, 0.7); 
            --skeleton-base: #334155;
            --skeleton-shine: #475569;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --border-radius: 12px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-top: 100px; 
        }

        .glass-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            display: flex;
            align-items: center;
        }

        .header-content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fluid-title {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: bold;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notification-wrapper {
            position: relative;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .live-indicator {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background-color: #ef4444; 
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            animation: pulse 1.5s infinite; 
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-lg) var(--spacing-lg) var(--spacing-lg);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; 
            gap: var(--spacing-lg);
        }

        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr); 
            }
        }

        @media (min-width: 1024px) {
            .grid-layout {
                grid-template-columns: repeat(4, 1fr); 
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }

        .card-image {
            height: 180px;
            background-size: cover;
            background-position: center;
        }

        .bg-1 { background-image: linear-gradient(135deg, #2563eb, #7c3aed); }
        .bg-2 { background-image: linear-gradient(135deg, #059669, #10b981); }
        .bg-3 { background-image: linear-gradient(135deg, #db2777, #f43f5e); }

        .card-content {
            padding: var(--spacing-md);
        }

        .card-content h2 {
            font-size: 1.25rem;
            margin-bottom: var(--spacing-sm);
        }

        .card-content p {
            font-size: 0.95rem;
            color: #94a3b8; 
        }

        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            border-radius: 4px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            pointer-events: none; 
        }

        .skeleton-card:hover {
            transform: none; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .skeleton-image {
            height: 180px;
            width: 100%;
            border-radius: 0; 
        }

        .skeleton-title {
            height: 24px;
            width: 70%; 
            margin-bottom: var(--spacing-md);
        }

        .skeleton-text {
            height: 16px;
            width: 100%;
            margin-bottom: var(--spacing-sm);
        }

        .skeleton-text:last-child {
            width: 80%;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <header class="glass-header">
        <div class="header-content">
            <h1 class="fluid-title">Keşif Platformu</h1>
            
            <div class="notification-wrapper">
                <span class="notification-icon">🔔</span>
                <span class="live-indicator"></span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="grid-layout">
            
            <article class="card">
                <div class="card-image bg-1"></div>
                <div class="card-content">
                    <h2>Şampiyonlar Ligi</h2>
                    <p>En çok oynanan rekabetçi oyunlar ve güncel turnuvalar.</p>
                </div>
            </article>

            <article class="card">
                <div class="card-image bg-2"></div>
                <div class="card-content">
                    <h2>Bilim Kurgu Klasikleri</h2>
                    <p>Uzay derinliklerinde geçen en iyi filmler koleksiyonu.</p>
                </div>
            </article>

            <article class="card">
                <div class="card-image bg-3"></div>
                <div class="card-content">
                    <h2>Yeni Çıkanlar</h2>
                    <p>Bu hafta platforma eklenen en taze içerikleri keşfet.</p>
                </div>
            </article>

            <article class="card skeleton-card">
                <div class="skeleton skeleton-image"></div>
                <div class="card-content">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-text"></div>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
