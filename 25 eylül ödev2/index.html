<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donanım & Ekipman Envanter Paneli</title>
    <style>
      :root {
        --bg: #f3f5f8;
        --card: #ffffff;
        --border: #dce1e7;
        --text: #111827;
        --muted: #64748b;
        --teal: #0f766e;
        --teal-hover: #115e59;
        --font-main: "Plus Jakarta Sans", system-ui, sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-main);
        padding: 36px 16px;
        line-height: 1.5;
      }
      .envanter {
        max-width: 960px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .header__tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--teal);
        font-weight: 700;
      }
      .header__title {
        font-size: 26px;
        font-weight: 700;
        margin-top: 2px;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-bottom: 24px;
      }
      .kpi-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 18px;
      }
      .kpi-card span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .kpi-card h3 {
        font-size: 22px;
        font-weight: 700;
        font-family: var(--font-mono);
        margin-top: 4px;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }
      @media (max-width: 768px) {
        .layout,
        .kpi-grid {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .panel h4 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .field input,
      .field select {
        width: 100%;
        padding: 8px 10px;
        font-size: 13px;
        font-family: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--teal);
        background: #fff;
      }

      .btn-submit {
        width: 100%;
        background: var(--teal);
        color: #fff;
        border: none;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 6px;
      }
      .btn-submit:hover {
        background: var(--teal-hover);
      }

      .filter-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 14px;
      }
      .device-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .device-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .device-item h5 {
        font-size: 13px;
        font-weight: 600;
      }
      .device-item p {
        font-size: 12px;
        color: var(--muted);
      }

      .meta-box {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        font-size: 11px;
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 600;
        background: #fef3c7;
        color: #92400e;
        font-family: var(--font-mono);
      }
      .badge--bilgisayar {
        background: #dbeafe;
        color: #1e40af;
      }
      .badge--ekran {
        background: #fce7f3;
        color: #9d174d;
      }
      .badge--aksesuar {
        background: #dcfce7;
        color: #166534;
      }

      .btn-del {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 11px;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-del:hover {
        background: #ef4444;
        color: #fff;
        border-color: #ef4444;
      }
    </style>
  </head>
  <body>
    <div class="envanter">
      <header class="header">
        <span class="header__tag"> Envanter Kontrol </span>
        <h1 class="header__title">Donanım Yönetim Paneli</h1>
      </header>
      <section class="kpi-grid">
        <div class="kpi-card">
          <span>Kayıtlı Ekipman</span>
          <h3 id="kpiCount">0</h3>
        </div>
        <div class="kpi-card">
          <span>Toplam Envanter Değeri: </span>
          <h3 id="kpiTotal">0 ₺</h3>
        </div>
        <div class="kpi-card">
          <span>Ortalama Birim Maliyet</span>
          <h3 id="kpiAvg">0 ₺</h3>
        </div>
      </section>
      <main class="layout">
        <section class="panel">
          <h4>Yeni Ekipman Kaydı</h4>
          <form id="deviceForm">
            <div class="field">
              <label for="devName">Ekipman Adı: </label>
              <input type="text" id="devName" placeholder="Mekanik Klavye" required />
            </div>
            <div class="field">
              <label for="devCat">Kategori</label>
              <select name="devCat" id="devCat">
                <option value="Bilgisayar">Bilgisayar</option>
                <option value="Ekran">Ekran</option>
                <option value="Aksesuar">Aksesuar</option>
              </select>
            </div>
            <div class="field">
              <label for="devPrice">Maliyet</label>
              <input
                type="number"
                id="devPrice"
                value="4500"
                min="250"
                step="250"
                required
              />
            </div>
            <button type="submit" class="btn-submit">Ekipmanı Kaydet</button>
          </form>
        </section>
        <section class="panel">
          <div class="filter-bar">
            <input
              type="text"
              id="searchInput"
              class="field"
              style="margin-bottom: 0"
              placeholder="Ekipman Adına Göre Filtrele"
            />
            <select
              id="categoryFilter"
              style="width: 140px; font-size: 12px; padding: 6px"
            >
              <option value="ALL">Tüm Kategoriler</option>
              <option value="Bilgisayar">Bilgisayar</option>
              <option value="Ekran">Ekran</option>
              <option value="Aksesuar">Aksesuar</option>
            </select>
          </div>
          <div id="deviceContainer" class="device-list"></div>
        </section>
      </main>
      <script>
        let devices = [
          { id: 1, name: "Dizüstü İş İstasyonu", category: "Bilgisayar", price: 42000 },
          { id: 2, name: "27 İnç 4K Monitör", category: "Ekran", price: 14500 },
          { id: 3, name: "Kablosuz Mouse", category: "Aksesuar", price: 2800 },
          { id: 4, name: "Mini Masaüstü PC", category: "Bilgisayar", price: 26000 },
          { id: 5, name: "USB-C Çoklayıcı Hub", category: "Aksesuar", price: 1700 },
        ];

        const deviceContainer = document.getElementById("deviceContainer");
        const deviceForm = document.getElementById("deviceForm");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const kpiCount = document.getElementById("kpiCount");
        const kpiTotal = document.getElementById("kpiTotal");
        const kpiAvg = document.getElementById("kpiAvg");

        const updateKPIs = (dataList) => {
          kpiCount.textContent = dataList.length;

          if (dataList.length === 0) {
            kpiTotal.textContent = "0 ₺";
            kpiAvg.textContent = "0 ₺";
            return;
          }
          const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
          kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;

          const avg = total / dataList.length;
          kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
        };

        const renderDevices = () => {
          const term = searchInput.value.toLowerCase().trim();
          const selectedCat = categoryFilter.value;

          const filtered = devices.filter((device) => {
            const matchesName = device.name.toLowerCase().includes(term);
            const matchesCategory =
              selectedCat === "ALL" || device.category === selectedCat;
            return matchesName && matchesCategory;
          });

          deviceContainer.innerHTML = "";

          if (filtered.length === 0) {
            deviceContainer.innerHTML = `
            <div style="padding:24px; text-align:center; color:var(--muted); font-size:12px">
            Kriterlere Uygun Ekipman Bulunamadı
            </div>
            `;
            updateKPIs([]);
            return;
          }

          filtered.forEach((device) => {
            const item = document.createElement("article");
            item.className = "device-item";
            item.setAttribute("data-id", device.id);
            const badgeClass =
              device.category === "Bilgisayar"
                ? "badge--bilgisayar"
                : device.category === "Ekran"
                  ? "badge--ekran"
                  : "badge--aksesuar";

            item.innerHTML = `
                <div>
                <h5>${device.name}</h5>
                <p>Birim Maliyet: ${device.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                <span class="badge ${badgeClass}">${device.category}</span>
                <button class="btn-del"
                data-action="delete">Sil</button>
                </div>
                `;
            deviceContainer.appendChild(item);
            updateKPIs(filtered);
          });
        };

        searchInput.addEventListener("input", renderDevices);
        categoryFilter.addEventListener("change", renderDevices);
        renderDevices();
      </script>
    </div>
  </body>
</html>
