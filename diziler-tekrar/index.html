<script>
let sayi1 = 100;
let sayi2 = sayi1;
sayi2 = 250;

console.log("sayi1:", sayi1);
console.log("sayi2:", sayi2);

const istasyonlarA = ["Kadıköy DC", "Beşiktaş AC"];
const istasyonlarB = istasyonlarA;
istasyonlarB.push("Üsküdar Ultra DC");

console.log("İstasyon A:", istasyonlarA);
console.log("İstasyon B:", istasyonlarB);
console.log(istasyonlarA === istasyonlarB);

const bagimsizKopya = [...istasyonlarA];
bagimsizKopya.push("Maltepe Hızlı");

console.log("Orijinal liste eleman sayısı:", istasyonlarA.length);
console.log("Yeni klon liste eleman sayısı:", bagimsizKopya.length);
console.log(istasyonlarA === bagimsizKopya);

const aktifArabalar = ["Togg", "Tesla"];
const yeniArabalar = [...aktifArabalar, "BYD"];
console.log("Yeni Arabalar:", yeniArabalar);

const kuyruk = ["Araç-1", "Araç-2", "Araç-3"];
kuyruk.push("Araç-4");
kuyruk.pop();
kuyruk.unshift("VIP-Araç");
kuyruk.shift();
kuyruk.splice(1, 1, "Acil-Araç");
console.log("Splice sonrası orijinal kuyruk:", kuyruk);

const istasyonlar = ["Zorlu", "Akasya", "Kanyon", "Vadi", "Mall Of"];
const secilenler = istasyonlar.slice(1, 4);
console.log("Slice ile alınan yeni dizi:", secilenler);
console.log("Orijinal istasyonlar:", istasyonlar);
console.log("Kanyon listede var mı?:", istasyonlar.includes("Kanyon"));
console.log("Kanyon kaçıncı sırada?:", istasyonlar.indexOf("Kanyon"));
console.log("Olmayan yer ararsak ne döner?:", istasyonlar.indexOf("Taksim"));

const soketler = ["soketA", "soketB", "arızaliSoket", "soketD"];
soketler.splice(2, 1, "soketC");
console.log("Tamir sonrası yeni dizi:", soketler);

const ilkIkiSoket = soketler.slice(0, 2);
console.log("Sadece A ve B soketleri alındı:", ilkIkiSoket);

const sehirler = ["İstanbul", "Ankara", "İzmir", "Bursa"];
sehirler.splice(1, 1, "Eskişehir");
console.log("Şehirler:", sehirler);

const sarjIstasyonlari = [
    { id: "IST-01", lokasyon: "Zorlu Center", tip: "DC", gucKw: 180, durum: "Aktif", seansAdet: 45, tarifeTL: 12 },
    { id: "IST-02", lokasyon: "Akasya AVM", tip: "AC", gucKw: 22, durum: "Aktif", seansAdet: 11, tarifeTL: 9 },
    { id: "IST-03", lokasyon: "Kanyon AVM", tip: "DC", gucKw: 120, durum: "Aktif", seansAdet: 22, tarifeTL: 12 },
    { id: "IST-04", lokasyon: "Vadi İstanbul", tip: "AC", gucKw: 22, durum: "Aktif", seansAdet: 33, tarifeTL: 8.5 },
    { id: "IST-05", lokasyon: "Mall Of İstanbul", tip: "DC", gucKw: 300, durum: "Pasif", seansAdet: 55, tarifeTL: 15 }
];

const sadeceLokasyonlar = sarjIstasyonlari.map(ist => ist.lokasyon);
console.log("Map ile Sadece Lokasyonlar:", sadeceLokasyonlar);

const istasyonOzetleri = sarjIstasyonlari.map(ist => {
    return `${ist.lokasyon} (${ist.tip}) - ${ist.gucKw} kW - ${ist.durum.toUpperCase()}`;
});
console.log("Özet Liste:", istasyonOzetleri);

const aktifDcIstasyonlar = sarjIstasyonlari.filter(ist => ist.tip === "DC" && ist.durum === "Aktif");
console.table(aktifDcIstasyonlar);

const sadeceGucDegeri = sarjIstasyonlari.map(guc => guc.gucKw);
console.log("Yalnızca güç değerleri:", sadeceGucDegeri);

const yalnizOndanKucukler = sarjIstasyonlari.filter(kucuk => kucuk.tarifeTL < 10);
console.log("10 TL'den küçük olanlar:", yalnizOndanKucukler);

const bulunan = sarjIstasyonlari.find(ist => ist.id === "IST-03");
console.log("Bulunan istasyon:", bulunan.lokasyon, bulunan.gucKw, "kW");

const bakimdaOlanVarMi = sarjIstasyonlari.some(ist => ist.durum === "Bakımda");
const pasifOlanVarMi = sarjIstasyonlari.some(ist => ist.durum === "Pasif");
const hepsiAktifMi = sarjIstasyonlari.every(ist => ist.durum === "Aktif");
console.log("Bakımda olan var mı?:", bakimdaOlanVarMi);
console.log("Pasif olan var mı?:", pasifOlanVarMi);
console.log("Tüm istasyonlar aktif mi?:", hepsiAktifMi);

const vadiIstasyonu = sarjIstasyonlari.find(bul => bul.lokasyon === "Vadi İstanbul");
console.log("Vadi İstanbul lokasyonu:", vadiIstasyonu);

const guc250DenBuyukVarMi = sarjIstasyonlari.some(bul => bul.gucKw > 250);
console.log("250'den büyük olan var mı?:", guc250DenBuyukVarMi);

const istasyonlar5TenBuyukMu = sarjIstasyonlari.every(bul => bul.tarifeTL > 5);
console.log("İstasyonların hepsi 5'ten büyük mü?:", istasyonlar5TenBuyukMu);

const toplamSeans = sarjIstasyonlari.reduce((kumbara, istasyon) => {
    return kumbara + istasyon.seansAdet;
}, 0);
console.log("Toplam yapılan şarj seansı:", toplamSeans);

const aktifDcToplamGuc = sarjIstasyonlari
    .filter(ist => ist.durum === "Aktif" && ist.tip === "DC")
    .map(ist => ist.gucKw)
    .reduce((toplam, guc) => toplam + guc, 0);
console.log("Aktif DC toplam güç kapasitesi:", aktifDcToplamGuc, "kW");

const pahaliAktifLokasyonlar = sarjIstasyonlari
    .filter(ist => ist.durum === "Aktif" && ist.tarifeTL > 10)
    .map(ist => ist.lokasyon);
console.log("Pahalı ve Aktif Lokasyonlar:", pahaliAktifLokasyonlar);

const koordinatlar = [41.0082, 28.9785];
const [enlem, boylam] = koordinatlar;
console.log(`Enlem: ${enlem}, Boylam: ${boylam}`);

const puanlar = [95, 88, 76, 65, 54];
const [birinci, ikinci, ...kalanlar] = puanlar;
console.log("Şampiyon:", birinci, "İkinci:", ikinci, "Kalanlar:", kalanlar);

const yarisSonucu = ["Togg", "Tesla", "BYD", "Mercedes", "BMW"];
const [altinMadalya, gumusMadalya, ...digerAraclar] = yarisSonucu;
console.log("Altın:", altinMadalya, "Gümüş:", gumusMadalya, "Diğerleri:", digerAraclar);
</script>
